services:
  db:
    image: postgres:17-alpine
    environment:
      # Dev-only credentials; never reused outside local development.
      POSTGRES_DB: craftquotes
      POSTGRES_USER: craftquotes
      POSTGRES_PASSWORD: craftquotes_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftquotes -d craftquotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
