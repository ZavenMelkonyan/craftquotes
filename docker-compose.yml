services:
  db:
    image: postgres:17-alpine
    environment:
      # Dev-only credentials; never reused outside local development.
      POSTGRES_DB: craftquotes
      POSTGRES_USER: craftquotes
      POSTGRES_PASSWORD: craftquotes_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftquotes -d craftquotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Quotes: "Host=db;Port=5432;Database=craftquotes;Username=craftquotes;Password=craftquotes_dev;GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "true"
      OpenApi__EnableUi: "true"
    ports:
      - "8080:8080"

volumes:
  db-data:
